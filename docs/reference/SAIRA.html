<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>SAIRA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout concept: a cinematic landing, then a calm dark workspace. Left rail of phases, main column of topics, side drawer for one item. Colour comes from six phase hues, brand violet-to-pink is reserved for progress and the logo. */
:root{
  --bg:#121214; --s1:#18181c; --s2:#1f1f25; --s3:#292931; --line:#2d2d36;
  --fg:#f3f3f6; --mut:#a0a0ad; --dim:#72727f;
  --v:#8b3dff; --p:#ff2e7e; --grad:linear-gradient(135deg,#8b3dff,#ff2e7e);
  --ok:#43d391; --warn:#f6b04a; --bad:#ff6363;
  --ph0:hsl(199 90% 62%); --ph1:hsl(38 95% 60%); --ph2:hsl(262 90% 74%); --ph3:hsl(152 60% 52%); --ph4:hsl(345 90% 68%); --ph5:hsl(186 70% 55%);
  --f-disp:'Instrument Serif',Georgia,serif; --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --navy:hsl(201 100% 13%);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #b58aff;outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}

/* ---------- liquid glass (landing) ---------- */
.liquid-glass{background:rgba(255,255,255,.01);background-blend-mode:luminosity;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,.1);position:relative;overflow:hidden}
.liquid-glass::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.15) 80%,rgba(255,255,255,.45) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
@keyframes fade-rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.animate-fade-rise{animation:fade-rise .8s ease-out both}
.animate-fade-rise-delay{animation:fade-rise .8s ease-out .2s both}
.animate-fade-rise-delay-2{animation:fade-rise .8s ease-out .4s both}

.landing{position:relative;min-height:max(640px,100svh);display:flex;flex-direction:column;background:var(--navy);color:#fff;overflow:hidden;--mut:hsl(240 4% 66%)}
.landing .hero{flex:1;justify-content:center}
.landing video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.landing .lnav,.landing .hero,.landing .lnote{position:relative;z-index:10}
.lnav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:24px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:34px;height:34px;flex:none}
.logo b{font-weight:600;letter-spacing:.18em;font-size:15px}
.lnav .links{display:none;gap:32px;font-size:14px;color:var(--mut)}
.lnav .links button{color:var(--mut);transition:color .2s}
.lnav .links button:hover{color:#fff}
.lnav .links .on{color:#fff}
@media(min-width:760px){.lnav .links{display:flex}}
.pill{border-radius:999px;color:#fff;transition:transform .2s}
.pill:hover{transform:scale(1.03)}
.pill.sm{padding:10px 24px;font-size:14px}
.pill.lg{padding:20px 56px;font-size:16px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:90px max(16px,env(safe-area-inset-left,0px)) 120px}
.hero h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(44px,9vw,96px);line-height:.95;letter-spacing:-2.46px;max-width:1240px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--mut)}
.hero p{color:var(--mut);font-size:clamp(16px,2vw,18px);max-width:640px;margin-top:32px;line-height:1.65}
.hero .pill{margin-top:48px;cursor:pointer}
.lnote{padding-bottom:20px;text-align:center;font-size:12px;color:var(--mut)}

/* ---------- preview strip ---------- */
.strip{background:#1b1424;border-bottom:1px solid #35244d;font-size:13px;color:#d8c8f5}
.strip .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-block:8px}
.strip .grow{flex:1;min-width:220px}
.strip button{border:1px solid #5a3c87;border-radius:8px;padding:4px 10px;font-size:12px;color:#eadcff}
.strip button:hover{background:#2b1c40}
.sample-on{color:var(--warn);font-weight:500}

/* ---------- app shell ---------- */
.app{min-height:100vh}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(18,18,20,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:60px}
.top .logo b{font-size:13px}
.tabs{display:none;gap:4px;margin-left:12px}
.tabs button{padding:8px 14px;border-radius:10px;color:var(--mut);font-weight:500;font-size:14px}
.tabs button:hover{color:var(--fg);background:var(--s2)}
.tabs button.on{color:var(--fg);background:var(--s2)}
@media(min-width:820px){.tabs{display:flex}}
.sp{flex:1}
.chip-streak{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:14px}
.chip-streak svg{width:16px;height:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;background:var(--s2);border:1px solid var(--line);font-weight:500;font-size:14px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--s3);border-color:#3b3b46}
.btn.pri{background:var(--v);border-color:var(--v);color:#fff}
.btn.pri:hover{background:#9a55ff}
.btn.ghost{background:none}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.av{width:32px;height:32px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff}
.hide-sm{display:none}
@media(min-width:560px){.hide-sm{display:inline-flex}}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;background:rgba(24,24,28,.96);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--mut);min-height:44px}
.bnav button.on{color:#fff}
.bnav svg{width:20px;height:20px}
@media(min-width:820px){.bnav{display:none}}
.page{padding-block:32px 96px}
@media(min-width:820px){.page{padding-bottom:64px}}

/* ---------- common bits ---------- */
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:20px}
.lbl{font-size:13px;color:var(--mut);font-weight:500}
.h-disp{font-family:var(--f-disp);font-weight:400;letter-spacing:-.01em;line-height:1.05}
.bar{height:6px;border-radius:99px;background:var(--s3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .4s}
.tg{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:6px;font-size:11px;font-weight:600;line-height:1}
.tg-K{background:#1b2a40;color:#9cc2ff}
.tg-S{background:#3b2616;color:#ffb877}
.tg-x{border:1px dashed #5b5b68;color:var(--mut)}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.badge.cand{border-color:#4a3a1c;color:#e6bd6b}
.badge.s-prog{border-color:#5a4318;color:var(--warn)}
.badge.s-rev{border-color:#5b2340;color:#ff86b2}
.badge.s-done{border-color:#1d4d37;color:var(--ok)}

/* ---------- today ---------- */
.greet h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(36px,6vw,56px);line-height:1;letter-spacing:-.01em}
.greet p{margin-top:8px;color:var(--mut)}
.tgrid{display:grid;gap:20px;margin-top:28px;grid-template-columns:1fr}
@media(min-width:960px){.tgrid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.quote{padding:28px;border-radius:18px;background:var(--s1);border:1px solid transparent;background-image:linear-gradient(var(--s1),var(--s1)),var(--grad);background-origin:border-box;background-clip:padding-box,border-box}
.quote blockquote{margin:0;font-family:var(--f-disp);font-size:clamp(26px,3.6vw,36px);line-height:1.18;text-wrap:balance}
.quote .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:20px}
.quote .cat{font-size:12px;color:var(--mut);margin-right:auto}
.cont{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-left:4px solid var(--ph,var(--v))}
.cont h3{font-size:18px;font-weight:600;margin-top:2px}
.cont .crumb{font-size:13px;color:var(--mut)}
.today-panel{display:flex;gap:20px;align-items:center}
.ringbox{position:relative;width:112px;height:112px;flex:none}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ringbox .mid b{font-size:26px;font-weight:600}
.ringbox .mid span{font-size:11px;color:var(--mut)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;font-weight:600;line-height:1.1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.week .sq{width:100%;aspect-ratio:1;max-width:44px;border-radius:10px;background:var(--s2);display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--fg)}
.week .sq.a{background:rgba(139,61,255,.28)}
.week .sq.t{outline:2px solid #b58aff;outline-offset:2px}

/* ---------- sheet ---------- */
.sheet{display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:940px){.sheet{grid-template-columns:280px minmax(0,1fr)}}
.rail{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
@media(min-width:940px){.rail{flex-direction:column;position:sticky;top:76px;align-self:start;max-height:calc(100vh - 92px);overflow:auto}}
.ovr{display:none}
@media(min-width:940px){.ovr{display:flex;gap:14px;align-items:center;padding:4px 4px 12px}}
.phc{flex:none;min-width:220px;text-align:left;border:1px solid var(--line);border-left:3px solid var(--ph);border-radius:12px;padding:12px 14px;background:linear-gradient(0deg,color-mix(in srgb,var(--ph) 6%,transparent),color-mix(in srgb,var(--ph) 6%,transparent)),var(--s1);display:flex;flex-direction:column;gap:8px}
.phc:hover{border-color:#40404c;border-left-color:var(--ph)}
.phc.on{background:linear-gradient(0deg,color-mix(in srgb,var(--ph) 14%,transparent),color-mix(in srgb,var(--ph) 14%,transparent)),var(--s2);border-color:#44444f;border-left-color:var(--ph)}
@media(min-width:940px){.phc{min-width:0}}
.phc .t{font-weight:600;font-size:14px;line-height:1.3}
.phc .r{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.phc .bar i{background:var(--ph)}
.ph-head{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.ph-head h2{font-family:var(--f-disp);font-weight:400;font-size:clamp(32px,4.6vw,46px);line-height:1}
.ph-head p{color:var(--mut);margin-top:8px;max-width:60ch}
.phtag{font-size:13px;font-weight:600;color:var(--ph)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.srch{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:38px}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%}
.srch:focus-within{border-color:#8f67d6}
.fchip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--mut)}
.fchip:hover{color:var(--fg)}
.fchip.on{background:var(--s3);color:var(--fg);border-color:#4a4a57}
.topic{border:1px solid var(--line);border-radius:14px;background:var(--s1);margin-bottom:12px;overflow:hidden}
.thead{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left}
.thead:hover{background:var(--s2)}
.thead .chev{width:18px;height:18px;flex:none;color:var(--mut);transition:transform .2s}
.topic.open .chev{transform:rotate(90deg)}
.thead .tt{flex:1;min-width:0}
.thead .tt b{font-weight:600;font-size:16px}
.thead .tt .n{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.thead .tg{margin-left:4px}
.thead .cnt{font-size:13px;color:var(--mut);text-align:right;min-width:58px}
.thead .bar{width:90px;display:none}
.thead .bar i{background:var(--ph)}
@media(min-width:620px){.thead .bar{display:block}}
.tbody{display:none;border-top:1px solid var(--line);padding:6px 8px 12px}
.topic.open .tbody{display:block}
.grp{font-size:12px;color:var(--mut);font-weight:500;padding:10px 10px 4px}
.row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;min-height:44px}
.row:hover{background:var(--s2)}
.chk{width:22px;height:22px;flex:none;border-radius:7px;border:1.5px solid #4c4c58;display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.chk:hover{border-color:var(--ph)}
.chk[aria-checked="true"]{background:var(--ph);border-color:var(--ph);color:#111}
.chk svg{width:14px;height:14px}
.rt{flex:1;min-width:0;text-align:left;font-size:14.5px;overflow-wrap:anywhere}
.row.done .rt{color:var(--mut);text-decoration:line-through;text-decoration-color:#55555f}
.rmeta{display:flex;gap:6px;align-items:center;flex:none}
.dots{display:flex;gap:2px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--s3)}
.dots i.f{background:var(--ph)}
.star{width:20px;height:20px;color:#585865}
.star.on{color:var(--warn)}
@media(max-width:620px){.rmeta .dots,.rmeta .tg:nth-child(n+2){display:none}}
.empty{padding:36px;text-align:center;color:var(--mut)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:80;background:var(--s1);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
.dhead{padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dhead h3{font-size:18px;font-weight:600;line-height:1.3;flex:1;min-width:0}
.dbody{padding:16px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.dfoot{padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seg button{padding:9px 10px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--mut)}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--s3);color:var(--fg);border-color:#555563}
.fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:6px;font-weight:500}
.fld input,.fld textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:0}
.fld input:focus,.fld textarea:focus{border-color:#8f67d6}
.fld textarea{resize:vertical;min-height:84px}
.cdots{display:flex;gap:8px}
.cdots button{width:32px;height:32px;border-radius:50%;border:1.5px solid #4c4c58;font-size:13px;font-weight:600;color:var(--mut)}
.cdots button.on{background:var(--ph);border-color:var(--ph);color:#111}

/* ---------- progress ---------- */
.pgrid{display:grid;gap:20px;grid-template-columns:1fr;margin-top:24px}
@media(min-width:960px){.pgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}}
.big{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.big .ringbox{width:150px;height:150px}
.big .ringbox .mid b{font-size:34px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;margin-top:14px;font-size:14px}
.pbar .bar{grid-column:1/-1}
.pbar .bar i{background:var(--ph)}
.pbar span:last-child{color:var(--mut);font-size:13px}
.wk{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:16px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:12px;color:var(--mut)}
.wk i{display:block;width:100%;max-width:40px;border-radius:6px 6px 2px 2px;background:var(--grad);min-height:2px}
.wk b{color:var(--fg);font-weight:600;font-size:13px}
.heat-wrap{overflow-x:auto;padding-bottom:6px;margin-top:14px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);grid-auto-columns:12px;gap:3px;width:max-content}
.heat i{border-radius:3px;background:var(--s2)}
.heat i.l1{background:rgba(139,61,255,.32)}.heat i.l2{background:rgba(139,61,255,.55)}.heat i.l3{background:rgba(160,80,255,.78)}.heat i.l4{background:#c06bff}
.heat i.t{outline:1.5px solid #fff;outline-offset:0}
.legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--s2);display:inline-block}

/* ---------- revision / settings ---------- */
.rev{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rev:last-child{border-bottom:0}
.rev .tx{flex:1;min-width:200px}
.rev .tx b{font-weight:500}
.rev .tx span{display:block;font-size:12.5px;color:var(--mut)}
.sgrid{display:grid;gap:20px;grid-template-columns:1fr;margin-top:24px}
@media(min-width:960px){.sgrid{grid-template-columns:1fr 1fr}}
.srow{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow input[type=time]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;color-scheme:dark}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mut)}
.days button.on{background:var(--v);border-color:var(--v);color:#fff}
.sw{width:44px;height:26px;border-radius:99px;background:var(--s3);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--v)}.sw.on::after{transform:translateX(18px)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);font-size:18px}
.note{font-size:13px;color:var(--mut);line-height:1.55}

/* ---------- coach ---------- */
.coach{position:fixed;z-index:90;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(460px,calc(100% - 32px));background:var(--s2);border:1px solid #4a3a6a;border-radius:20px;padding:16px;display:flex;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.55);transform:translateY(140%);opacity:0;transition:transform .45s cubic-bezier(.2,.9,.3,1),opacity .3s}
.coach.on{transform:none;opacity:1}
@media(max-width:819px){.coach{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
.cav{width:92px;height:92px;flex:none;border-radius:50%;background:#2a2036;overflow:hidden;position:relative}
.cav.talk{box-shadow:0 0 0 3px rgba(255,46,126,.5)}
.cav svg{width:100%;height:100%;display:block}
.cav .mo{display:none}.cav .mc{display:block}
.cav.talk .mo{display:block;animation:mouth .32s infinite alternate;transform-origin:80px 85px}
.cav.talk .mc{display:none}
@keyframes mouth{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.cbody{flex:1;min-width:0}
.cslot{font-size:12px;color:#c9a9ff;font-weight:500}
.cline{font-size:16px;line-height:1.4;margin:4px 0 12px}
.cbtn{display:flex;gap:8px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:100;background:#2b2b34;border:1px solid #444452;border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#c9a9ff;font-weight:600}
@media(min-width:820px){.toast{bottom:28px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

const QUOTES=[{"id":"q001","cat":"start","text":"You don't need a perfect plan today. You need one problem and twenty honest minutes."},{"id":"q002","cat":"start","text":"The sheet is long. Today's row is short. Open it."},{"id":"q003","cat":"start","text":"Every engineer you admire once stared at a blank editor and typed the first line anyway."},{"id":"q004","cat":"start","text":"Motivation is a visitor. A habit is a roommate. Make it move in."},{"id":"q005","cat":"start","text":"Start with the smallest version of today: one subtopic, one dry run."},{"id":"q006","cat":"start","text":"Your future self is already proud of whoever opens the editor first."},{"id":"q007","cat":"start","text":"Don't wait to feel ready. Ready is built by doing the first rep badly."},{"id":"q008","cat":"start","text":"A quiet morning, a fresh tab, one solid problem. That's the whole recipe."},{"id":"q009","cat":"consistency","text":"Thirty small days beat one heroic weekend."},{"id":"q010","cat":"consistency","text":"Streaks are just promises you keep to yourself, one day at a time."},{"id":"q011","cat":"consistency","text":"Consistency is boring on purpose. That's why it works."},{"id":"q012","cat":"consistency","text":"You're not behind. You're mid-rep. Keep going."},{"id":"q013","cat":"consistency","text":"Showing up on a tired day counts double."},{"id":"q014","cat":"consistency","text":"Compounding doesn't care about your mood, only your attendance."},{"id":"q015","cat":"consistency","text":"Make the habit so small it's embarrassing to skip."},{"id":"q016","cat":"consistency","text":"The graph rewards the days nobody clapped for."},{"id":"q017","cat":"consistency","text":"Protect the daily slot like it's a meeting with your dream job."},{"id":"q018","cat":"consistency","text":"Rhythm beats intensity. Find yours and defend it."},{"id":"q019","cat":"struggle","text":"If it feels hard, that's the feeling of your brain building new roads."},{"id":"q020","cat":"struggle","text":"Stuck for an hour? Good. You're at the exact edge where learning happens."},{"id":"q021","cat":"struggle","text":"A wrong answer is a free lesson with your name on it."},{"id":"q022","cat":"struggle","text":"Brute force first. Elegance is a second draft."},{"id":"q023","cat":"struggle","text":"Dry-run it on paper. The bug is usually hiding in plain sight."},{"id":"q024","cat":"struggle","text":"Confusion is just understanding that hasn't arrived yet."},{"id":"q025","cat":"struggle","text":"Recursion looks like magic until you trace the call stack. Then it looks like patience."},{"id":"q026","cat":"struggle","text":"Nobody remembers how long a solution took, only that you finished it."},{"id":"q027","cat":"struggle","text":"Read the editorial after you've fought for it. Then the lesson sticks."},{"id":"q028","cat":"struggle","text":"Hard problems are just easy problems wearing a trench coat."},{"id":"q029","cat":"comeback","text":"Missed a day? The streak is a tool, not a verdict. Start again right now."},{"id":"q030","cat":"comeback","text":"The best day to restart was yesterday. The second best is the next ten minutes."},{"id":"q031","cat":"comeback","text":"A pause isn't a failure. Quitting is a decision, and you haven't made it."},{"id":"q032","cat":"comeback","text":"Come back gently. One easy problem is a real comeback."},{"id":"q033","cat":"comeback","text":"Your progress didn't vanish. It's waiting where you left it."},{"id":"q034","cat":"comeback","text":"Rebuild the habit before you rebuild the speed."},{"id":"q035","cat":"milestone","text":"Look at the board. Every green square was a decision you made."},{"id":"q036","cat":"milestone","text":"You've done more than you think. Scroll up and count."},{"id":"q037","cat":"milestone","text":"A new phase unlocked. The roadmap is working because you are."},{"id":"q038","cat":"milestone","text":"Celebrate for a minute, then pick up the next problem."},{"id":"q039","cat":"milestone","text":"A week of showing up is the start of an identity."},{"id":"q040","cat":"milestone","text":"This is what discipline looks like: a calm line going up and to the right."},{"id":"q041","cat":"revision","text":"Revision is where a solved problem becomes a skill."},{"id":"q042","cat":"revision","text":"Forgetting is normal. Reviewing on schedule is the cure."},{"id":"q043","cat":"revision","text":"Re-solve it without peeking. That's the real test."},{"id":"q044","cat":"revision","text":"Ten minutes of revision today saves ten hours of panic before placements."},{"id":"q045","cat":"revision","text":"Explain the approach out loud. If you can teach it, you own it."},{"id":"q046","cat":"start","text":"Pick the next row. Not the whole sheet. Just the next row."},{"id":"q047","cat":"consistency","text":"Build in public with yourself: log the day, even the messy ones."},{"id":"q048","cat":"struggle","text":"Time and space complexity are just honest bookkeeping. Keep the books."},{"id":"q049","cat":"consistency","text":"Small, steady, unstoppable."},{"id":"q050","cat":"start","text":"Open the editor. The rest of the day will thank you."}];

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PHC=['var(--ph0)','var(--ph1)','var(--ph2)','var(--ph3)','var(--ph4)','var(--ph5)'];

const VIDEO='https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260314_131748_f2ca2a28-fed7-44c8-b9a9-bd9acdd5ec31.mp4';

const ITEMS=[],BY={};
SEED.forEach((ph,pi)=>ph.topics.forEach((t,ti)=>{

}));

/* ---------- state ---------- */
function fresh(){return{P:{},days:{},fav:[],shift:0,sample:false,set:{t1:'08:30',t2:'19:00',voice:true,target:3,dow:[1,1,1,1,1,1,0]},ui:{view:'landing',phase:0,open:{},filter:'all',src:'',q:'',drawer:null}}}
let S=fresh();

let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},250)}

/* ---------- dates (India time) ---------- */
const fmtKey=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'});
const tk=()=>fmtKey.format(new Date());
const addDays=(k,n)=>{const d=new Date(k+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const dow=k=>(new Date(k+'T12:00:00Z').getUTCDay()+6)%7;
const nice=(k,o)=>new Date(k+'T12:00:00Z').toLocaleDateString('en-IN',Object.assign({timeZone:'UTC'},o));
function hourIST(){return +new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',hour:'2-digit',hour12:false}).format(new Date())}
const t12=h=>{const[a,b]=h.split(':').map(Number);return((a+11)%12+1)+':'+String(b).padStart(2,'0')+(a<12?' AM':' PM')};

/* ---------- stats ---------- */
const P=()=>S.P;
const isDone=id=>S.P[id]&&S.P[id].s==='done';
function counts(list){let d=0;list.forEach(i=>{if(isDone(i.id))d++});return{d,t:list.length}}
const phaseItems=pi=>ITEMS.filter(i=>i.topic.pi===pi);
const topicItems=t=>ITEMS.filter(i=>i.topic===t);
function active(k){const d=S.days[k];return !!d&&(d.n>0||d.r>0||d.m>=15)}
function streak(){const today=tk();let k=active(today)?today:addDays(today,-1),c=0;while(active(k)){c++;k=addDays(k,-1)}
  const keys=Object.keys(S.days).filter(active).sort();let best=0,run=0,prev=null;keys.forEach(x=>{run=(prev&&addDays(prev,1)===x)?run+1:1;best=Math.max(best,run);prev=x});return{cur:c,best:Math.max(best,c)}}
function pace(){const t=tk();let n=0,a=0;for(let i=0;i<14;i++){const k=addDays(t,-i);if(active(k)){a++;n+=(S.days[k].n||0)}}return a&&n?n/a:0}
function consistency(){const t=tk();let a=0;for(let i=0;i<30;i++)if(active(addDays(t,-i)))a++;return a}
function bump(k,f,v){const d=S.days[k]||(S.days[k]={n:0,m:0,r:0});d[f]=Math.max(0,(d[f]||0)+v)}
const STEPS=[1,3,7,21,60];

/* ---------- actions ---------- */
function setDone(id,on){const p=S.P[id]||(S.P[id]={});const k=tk();
  if(on&&p.s!=='done'){p.s='done';p.at=k;p.r={step:0,due:addDays(k,1)};bump(k,'n',1)}
  else if(!on&&p.s==='done'){bump(p.at||k,'n',-1);p.s='todo';delete p.at;delete p.r}}
function setStatus(id,s){const p=S.P[id]||(S.P[id]={});
  if(s==='done')setDone(id,true);else{if(p.s==='done')setDone(id,false);p.s=(s==='todo')?'todo':s}}
let toastT,undoFn=null;
function toast(msg,undo){const el=$('#toast');undoFn=undo||null;el.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button data-act="undo">Undo</button>':'');el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),6000)}
function firstTodo(){return ITEMS.find(i=>i.kind==='learn'&&!isDone(i.id))||ITEMS.find(i=>!isDone(i.id))}
function dueList(){const t=tk();return ITEMS.filter(i=>{const p=S.P[i.id];return p&&p.s==='done'&&p.r&&p.r.due<=t}).sort((a,b)=>S.P[a.id].r.due.localeCompare(S.P[b.id].r.due))}

function loadSample(){S=fresh();S.sample=true;S.ui.view='today';const counts=[3,4,2,0,5,3,4,0,6,3,4,2];const learn=ITEMS.filter(i=>i.kind==='learn');let x=0;const today=tk();
  counts.forEach((c,j)=>{const off=11-j,k=addDays(today,-off);for(let n=0;n<c;n++){const it=learn[x++];const step=off>=9?2:off>=5?1:0;const due=addDays(k,[1,4,11][step]);S.P[it.id]={s:'done',at:k,c:[3,4,2,5,3][x%5],r:{step,due}}}
    if(c)S.days[k]={n:c,m:20+((j*9)%35),r:0}});
  learn.slice(x,x+2).forEach(i=>S.P[i.id]={s:'prog'});
  [learn[2],learn[9]].forEach(i=>{S.P[i.id].s='rev';delete S.P[i.id].r});
  [learn[0],learn[5],learn[14]].forEach(i=>S.P[i.id].bm=true);
  S.P[learn[1].id].idea='Remote is the shared copy; origin is just a nickname for it.';
  S.P[learn[1].id].note='Practise: clone, commit, push. Remember to pull before pushing.';
  S.P[learn[9].id].mistakes='Mixed up this and super in constructors.';
  S.ui.phase=0;S.ui.open={[learn[x].topic.id]:true};save();}

<circle cx="63" cy="81" r="4.5" fill="#ff7b9c" opacity=".35"/><circle cx="97" cy="81" r="4.5" fill="#ff7b9c" opacity=".35"/>
<circle cx="54" cy="78" r="2.4" fill="#ff2e7e"/><circle cx="106" cy="78" r="2.4" fill="#ff2e7e"/>
<path class="mc" d="M73 85Q80 91 87 85" stroke="#7a2438" stroke-width="2.4" fill="none" stroke-linecap="round"/>

/* ---------- views ---------- */
function landing(){return`<section class="landing">
<video autoplay loop muted playsinline src="${VIDEO}"></video>
<div class="wrap"><nav class="lnav"><div class="logo">${MARK(34)}<b>SAIRA</b></div>
<div class="links"><button class="on" data-act="landing">Home</button><button data-act="nav" data-v="sheet">Sheet</button><button data-act="nav" data-v="progress">Progress</button><button data-act="nav" data-v="settings">Reminders</button></div>
<button class="pill sm liquid-glass" data-act="enter">Start today</button></nav></div>
<div class="hero"><h1 class="animate-fade-rise">Where <em>dreams</em> rise <em>through the daily reps.</em></h1>
<p class="animate-fade-rise-delay">A quiet place to learn data structures and algorithms. One sheet, one streak, one gentle nudge a day.</p>
<button class="pill lg liquid-glass animate-fade-rise-delay-2" data-act="enter">Continue with Google</button></div>
<div class="lnote">Preview: the looping background video plays here in the live app. This button skips sign-in.</div></section>`}

function greeting(){const h=hourIST();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function quoteOfDay(){const k=tk();let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))%100000;return QUOTES[(h+S.shift)%QUOTES.length]}
function today(){
  const k=tk(),d=S.days[k]||{n:0,m:0},tg=S.set.target,st=streak(),q=quoteOfDay(),nx=firstTodo(),due=dueList().length;
  const phIdx=nx?nx.topic.pi:0;
  let wk='';for(let i=6;i>=0;i--){const kk=addDays(k,-i),dd=S.days[kk];wk+=`<div><span>${nice(kk,{weekday:'narrow'})}</span><span class="sq num ${active(kk)?'a':''} ${i===0?'t':''}">${dd?dd.n:0}</span></div>`}
  return`<div class="wrap page"><div class="greet"><h1>${greeting()}, ${NAME}.</h1><p>${nice(k,{weekday:'long',day:'numeric',month:'long'})}${S.sample?' · <span class="sample-on">Sample progress loaded</span>':''}</p></div>
<div class="tgrid"><div class="col">
<div class="quote"><blockquote>${esc(q.text)}</blockquote><div class="meta"><span class="cat">${esc(q.cat)}</span>
<button class="btn sm" data-act="qfav" aria-pressed="${S.fav.includes(q.id)}">${S.fav.includes(q.id)?'♥ Saved':'♡ Save'}</button><button class="btn sm" data-act="qnext">Another one</button><button class="btn sm" data-act="qcopy">Copy</button></div></div>
${nx?`<div class="card cont" style="--ph:${PHC[phIdx]}"><div><div class="lbl">Continue where you left off</div><h3>${esc(nx.t)}</h3><div class="crumb">Phase ${phIdx} · ${esc(nx.topic.t)}</div></div><button class="btn pri" data-act="cont">Open in sheet</button></div>`:'<div class="card">Every item is done. Nice work.</div>'}
<div class="card"><div class="lbl">Last 7 days</div><div class="week">${wk}</div></div></div>
<div class="col"><div class="card"><div class="today-panel">${ring(d.n/tg,d.n+'/'+tg,'today')}<div class="stat"><span class="lbl">Current streak</span><b class="num" style="display:flex;gap:8px;align-items:center"><span class="chip-streak" style="border:0;padding:0">${FLAME}</span>${st.cur} ${st.cur===1?'day':'days'}</b><span class="mut" style="font-size:13px">Longest: ${st.best}</span></div></div>
<p class="note" style="margin-top:14px">${d.n>=tg?'Today\'s goal is done. Anything more is a bonus.':'Finish '+(tg-d.n)+' more '+(tg-d.n===1?'item':'items')+' to hit today\'s goal. One rest day a week keeps your streak.'}</p></div>
<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><div class="lbl">Revision queue</div><div class="stat"><b class="num">${due}</b></div></div><button class="btn" data-act="nav" data-v="revision">${due?'Start revising':'See schedule'}</button></div>
</div></div></div>`}

function matches(it){
  const p=S.P[it.id]||{},f=S.ui.filter,q=S.ui.q.trim().toLowerCase();
  if(q&&!(it.t.toLowerCase().includes(q)||(p.note||'').toLowerCase().includes(q)||(p.idea||'').toLowerCase().includes(q)))return false;
  if(S.ui.src&&!(it.src||it.topic.s).includes(S.ui.src))return false;
  if(f==='todo'&&p.s==='done')return false;
  if(f==='done'&&p.s!=='done')return false;
  if(f==='bm'&&!p.bm)return false;
  if(f==='due'&&!(p.s==='done'&&p.r&&p.r.due<=tk()))return false;
  return true}
function rowHTML(it){const p=S.P[it.id]||{},done=p.s==='done',pi=it.topic.pi;
  const tags=(it.src||it.topic.s).split('').map(c=>`<span class="tg tg-${c==='+'?'x':c}">${c}</span>`).join('');
  const st=p.s==='prog'?'<span class="badge s-prog">In progress</span>':p.s==='rev'?'<span class="badge s-rev">Needs revision</span>':'';
  const dots=p.c?`<span class="dots" title="Confidence ${p.c} of 5">${[1,2,3,4,5].map(n=>`<i class="${n<=p.c?'f':''}"></i>`).join('')}</span>`:'';
  return`<div class="row ${done?'done':''}" style="--ph:${PHC[pi]}"><button class="chk" role="checkbox" aria-checked="${done}" aria-label="Mark ${esc(it.t)} done" data-act="tick" data-id="${it.id}">${CHECK}</button>
<button class="rt" data-act="open" data-id="${it.id}">${esc(it.t)}</button><span class="rmeta">${it.kind==='practice'?'<span class="badge cand">candidate</span>':''}${st}${dots}${tags}<button data-act="bm" data-id="${it.id}" aria-label="Bookmark" aria-pressed="${!!p.bm}" style="display:grid">${STAR.replace('class="star"','class="star '+(p.bm?'on':'')+'"')}</button></span></div>`}
function sheet(){
  const pi=S.ui.phase,ph=SEED[pi],all=ITEMS,tot=counts(all);
  const rail=SEED.map((x,i)=>{const c=counts(phaseItems(i));return`<button class="phc ${i===pi?'on':''}" style="--ph:${PHC[i]}" data-act="phase" data-i="${i}"><span class="t">${i}. ${esc(x.t)}</span><span class="r"><span class="num">${c.d}/${c.t}</span><span class="num">${c.t?Math.round(c.d/c.t*100):0}%</span></span><div class="bar"><i style="width:${c.t?c.d/c.t*100:0}%"></i></div></button>`}).join('');
  const pc=counts(phaseItems(pi));
  let body='',shown=0;
  ph.topics.forEach(t=>{
    const its=topicItems(t),c=counts(its),open=!!S.ui.open[t.id]||(S.ui.q&&true);
    const lr=its.filter(i=>i.kind==='learn'&&matches(i)),pr=its.filter(i=>i.kind==='practice'&&matches(i));
    if((S.ui.q||S.ui.filter!=='all'||S.ui.src)&&!lr.length&&!pr.length)return;
    shown++;
    body+=`<div class="topic ${open?'open':''}" style="--ph:${PHC[pi]}"><button class="thead" data-act="topic" data-id="${t.id}">${CHEV}<span class="tt"><b>${esc(t.t)}</b>${t.e?'<span class="n">Breakdown drafted by Claude, please check</span>':''}${t.n?'<span class="n">'+esc(t.n)+'</span>':''}${t.st?'<span class="n">Striver section: '+esc(t.st)+'</span>':''}</span>${t.s.split('').map(ch=>`<span class="tg tg-${ch==='+'?'x':ch}">${ch}</span>`).join('')}<span class="cnt num">${c.d}/${c.t}</span><div class="bar"><i style="width:${c.t?c.d/c.t*100:0}%"></i></div></button>
<div class="tbody">${lr.length?'<div class="grp">Learn</div>'+lr.map(rowHTML).join(''):''}${pr.length?'<div class="grp">Practice, candidates to confirm against Striver</div>'+pr.map(rowHTML).join(''):''}</div></div>`});
  if(!shown)body='<div class="empty">Nothing matches. Clear the search or filter.</div>';
  const F=[['all','All'],['todo','Not done'],['done','Done'],['due','Due for revision'],['bm','Bookmarked']].map(([k,l])=>`<button class="fchip ${S.ui.filter===k?'on':''}" data-act="filter" data-f="${k}">${l}</button>`).join('');
  const SR=[['K','Kunal'],['S','Striver'],['+','Added']].map(([k,l])=>`<button class="fchip ${S.ui.src===k?'on':''}" data-act="src" data-f="${k}">${l}</button>`).join('');
  return`<div class="wrap page"><div class="sheet"><div class="rail"><div class="ovr">${ring(tot.d/tot.t,Math.round(tot.d/tot.t*100)+'%',tot.d+' of '+tot.t)}<div><div class="lbl">Whole sheet</div><div class="num" style="font-weight:600">${tot.d} done</div><div class="mut" style="font-size:13px">${tot.t-tot.d} to go</div></div></div>${rail}</div>
<div style="min-width:0;--ph:${PHC[pi]}"><div class="ph-head"><div><div class="phtag">Phase ${pi}</div><h2>${esc(ph.t)}</h2><p>${esc(ph.d)}</p></div><div style="display:flex;gap:12px;align-items:center"><div class="stat" style="text-align:right"><b class="num">${pc.d}/${pc.t}</b><span class="mut" style="font-size:13px">items done</span></div><button class="btn pri" data-act="cont">Continue</button></div></div>
<div class="tools"><label class="srch"><span class="mut" aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search items and notes" value="${esc(S.ui.q)}" aria-label="Search"></label>${F}</div><div class="tools" style="margin-top:-6px">${SR}</div>${body}</div></div></div>`}

function revision(){const due=dueList(),t=tk();
  const up=ITEMS.filter(i=>{const p=S.P[i.id];return p&&p.s==='done'&&p.r&&p.r.due>t}).length;
  const rows=due.map(i=>{const p=S.P[i.id];return`<div class="rev"><span class="tg tg-x" style="border:0;background:${'transparent'};color:${PHC[i.topic.pi]};min-width:0;padding:0;font-size:18px">●</span><div class="tx"><b>${esc(i.t)}</b><span>Phase ${i.topic.pi} · ${esc(i.topic.t)} · due ${nice(p.r.due,{day:'numeric',month:'short'})} · review ${p.r.step+1} of ${STEPS.length}</span></div><button class="btn sm" data-act="revshaky" data-id="${i.id}">Still shaky</button><button class="btn sm pri" data-act="revdone" data-id="${i.id}">Revised</button></div>`}).join('');
  return`<div class="wrap page"><div class="greet"><h1>Revision</h1><p>Finished items come back after 1, 3, 7, 21 and 60 days. Shaky ones come back sooner.</p></div>
<div class="card" style="margin-top:24px"><div class="lbl">${due.length} due now · ${up} scheduled later</div>${rows||'<div class="empty">Nothing is due. Items you finish appear here the next day.</div>'}</div></div>`}

function progress(){const tot=counts(ITEMS),st=streak(),pc=pace(),rem=tot.t-tot.d,con=consistency(),t=tk();
  const proj=pc>0?nice(addDays(t,Math.ceil(rem/pc)),{day:'numeric',month:'short',year:'numeric'}):null;
  const phs=SEED.map((x,i)=>{const c=counts(phaseItems(i));return`<div class="pbar" style="--ph:${PHC[i]}"><span>${i}. ${esc(x.t)}</span><span class="num">${c.d}/${c.t}</span><div class="bar"><i style="width:${c.t?c.d/c.t*100:0}%"></i></div></div>`}).join('');
  const ws=addDays(t,-dow(t));let wk=[],mx=1;for(let w=7;w>=0;w--){const s=addDays(ws,-7*w);let n=0;for(let i=0;i<7;i++){const d=S.days[addDays(s,i)];if(d)n+=d.n}wk.push([s,n]);mx=Math.max(mx,n)}
  const wkh=wk.map(([s,n])=>`<div><b class="num">${n}</b><i style="height:${Math.max(2,n/mx*100)}%"></i><span>${nice(s,{day:'numeric',month:'short'})}</span></div>`).join('');
  const start=addDays(ws,-52*7);let cells='';for(let i=0;i<53*7;i++){const k=addDays(start,i);if(k>t){cells+='<i style="visibility:hidden"></i>';continue}const d=S.days[k],n=d?d.n:0;const l=!d?0:n>=7?4:n>=5?3:n>=3?2:(n>=1||d.m>=15)?1:0;cells+=`<i class="${l?'l'+l:''} ${k===t?'t':''}" title="${nice(k,{day:'numeric',month:'short',year:'numeric'})}: ${n} items"></i>`}
  return`<div class="wrap page"><div class="greet"><h1>Progress</h1><p>Every number here comes from what you tick.${S.sample?' <span class="sample-on">Sample progress loaded.</span>':''}</p></div>
<div class="pgrid"><div class="col"><div class="card"><div class="big">${ring(tot.d/tot.t,Math.round(tot.d/tot.t*100)+'%',tot.d+' of '+tot.t)}<div class="kv" style="flex:1;min-width:220px"><div class="stat"><span class="lbl">Streak</span><b class="num">${st.cur}</b></div><div class="stat"><span class="lbl">Longest</span><b class="num">${st.best}</b></div><div class="stat"><span class="lbl">Active days, last 30</span><b class="num">${con}</b></div><div class="stat"><span class="lbl">Items per active day</span><b class="num">${pc?pc.toFixed(1):'–'}</b></div></div></div>
<p class="note" style="margin-top:16px">${proj?`At this pace the sheet finishes around <b style="color:var(--fg)">${proj}</b>, with ${rem} items to go.`:`${rem} items to go. Tick a few items over two days and a finish date appears here.`}</p></div>
<div class="card"><div class="lbl">By phase</div>${phs}</div></div>
<div class="col"><div class="card"><div class="lbl">Items finished per week</div><div class="wk">${wkh}</div></div>
<div class="card"><div class="lbl">Past year</div><div class="heat-wrap"><div class="heat">${cells}</div></div><div class="legend">Less <i></i><i style="background:rgba(139,61,255,.32)"></i><i style="background:rgba(139,61,255,.55)"></i><i style="background:rgba(160,80,255,.78)"></i><i style="background:#c06bff"></i> More</div></div></div></div></div>`}

function settings(){const s=S.set,dn=['M','T','W','T','F','S','S'];
  return`<div class="wrap page"><div class="greet"><h1>Reminders and settings</h1><p>Times are in India time. Reminders skip a slot when today's goal is already done.</p></div>
<div class="sgrid"><div class="card"><div class="lbl">Reminder times</div>
<div class="srow"><label for="t1">Morning nudge</label><input id="t1" type="time" value="${s.t1}" data-set="t1"></div>
<div class="srow"><label for="t2">Study time</label><input id="t2" type="time" value="${s.t2}" data-set="t2"></div>
<div class="srow"><span>Days</span><div class="days">${dn.map((d,i)=>`<button class="${s.dow[i]?'on':''}" data-act="dow" data-i="${i}" aria-pressed="${!!s.dow[i]}">${d}</button>`).join('')}</div></div>
<div class="srow"><span>Coach speaks aloud</span><button class="sw ${s.voice?'on':''}" role="switch" aria-checked="${!!s.voice}" aria-label="Coach speaks aloud" data-act="voice"></button></div>
<div class="srow"><span>Daily goal</span><div class="step"><button data-act="tgt" data-d="-1" aria-label="Fewer">−</button><b class="num" style="min-width:24px;text-align:center">${s.target}</b><button data-act="tgt" data-d="1" aria-label="More">+</button><span class="mut">items</span></div></div></div>
<div class="card"><div class="lbl">Try the coach</div><p class="note" style="margin:8px 0 14px">This is how she appears in the app at your reminder times.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-act="coach" data-k="morning">Morning nudge</button><button class="btn" data-act="coach" data-k="study">Study time</button><button class="btn" data-act="coach" data-k="nudge_missed">After a missed day</button></div>
<p class="note" style="margin-top:16px">The coach appears inside SAIRA, and her picture shows on the notification. A browser cannot draw her over your desktop outside the browser. When SAIRA is installed and notifications are allowed, the 8:30 AM and 7:00 PM nudges also arrive with the app closed, though the phone or browser may delay them.</p></div>
<div class="card"><div class="lbl">Install</div><p class="note" style="margin:8px 0 14px">SAIRA installs like an app, opens in its own window and works offline.</p><button class="btn" data-act="install">Install SAIRA</button></div>
<div class="card"><div class="lbl">Your data</div><p class="note" style="margin:8px 0 14px">In the live app your progress saves to your account and syncs across devices. Here it stays in this browser.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="copyjson">Copy backup JSON</button><button class="btn" data-act="reset">Reset all progress</button></div></div></div></div>`}

function render(){const root=$('#root'),y=window.scrollY;
  root.innerHTML=S.ui.view==='landing'?landing():shell();
  if(S.ui.view==='landing'){const vd=root.querySelector('video');if(vd){vd.muted=true;const p=vd.play&&vd.play();if(p&&p.catch)p.catch(()=>{})}}
  const q=$('#q');if(q&&S.ui.focusQ){q.focus();const l=q.value.length;q.setSelectionRange(l,l)}
  save()}

/* ---------- drawer ---------- */
function openDrawer(id){S.ui.drawer=id;const it=BY[id],p=S.P[id]||{},pi=it.topic.pi;
  const tags=(it.src||it.topic.s).split('').map(c=>`<span class="tg tg-${c==='+'?'x':c}">${c}</span>`).join('');
  const sg=[['todo','Not started'],['prog','In progress'],['done','Done'],['rev','Needs revision']].map(([k,l])=>`<button class="${(p.s||'todo')===k?'on':''}" data-act="status" data-id="${id}" data-s="${k}">${l}</button>`).join('');
  const cd=[1,2,3,4,5].map(n=>`<button class="${p.c===n?'on':''}" data-act="conf" data-id="${id}" data-n="${n}" aria-label="Confidence ${n}">${n}</button>`).join('');
  $('#drawer').style.setProperty('--ph',PHC[pi]);
  $('#drawer').innerHTML=`<div class="dhead"><div style="flex:1;min-width:0"><div class="mut" style="font-size:12.5px;margin-bottom:4px">Phase ${pi} · ${esc(it.topic.t)}</div><h3>${esc(it.t)}</h3><div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">${tags}${it.kind==='practice'?'<span class="badge cand">candidate, not verified</span>':''}</div></div><button class="btn sm ghost" data-act="closeDrawer" aria-label="Close">✕</button></div>
<div class="dbody"><div class="fld"><label>Status</label><div class="seg">${sg}</div></div>
<div class="fld"><label>Confidence (1 shaky, 5 could teach it)</label><div class="cdots">${cd}</div></div>
<div class="fld"><label for="f-idea">Key idea</label><input id="f-idea" data-f="idea" value="${esc(p.idea||'')}" placeholder="One line you would tell a friend"></div>
<div class="fld"><label for="f-mis">Mistakes I made</label><input id="f-mis" data-f="mistakes" value="${esc(p.mistakes||'')}" placeholder="What tripped you up"></div>
<div class="fld"><label for="f-note">Notes</label><textarea id="f-note" data-f="note" placeholder="Markdown notes">${esc(p.note||'')}</textarea></div>
<div class="fld"><label for="f-vid">Video link</label><input id="f-vid" data-f="vid" value="${esc(p.vid||'')}" placeholder="https://"></div>
<div class="fld"><label for="f-art">Article link</label><input id="f-art" data-f="art" value="${esc(p.art||'')}" placeholder="https://"></div>
${it.kind==='practice'?`<div class="fld"><label for="f-prc">Problem link</label><input id="f-prc" data-f="prc" value="${esc(p.prc||'')}" placeholder="https://"></div>`:''}
<div class="fld"><label for="f-min">Minutes spent</label><input id="f-min" type="number" min="0" data-f="min" value="${esc(p.min||'')}" placeholder="0"></div>
<p class="note">Links you add are yours. SAIRA never shows a link as official unless it has been checked.</p></div>
<div class="dfoot"><span id="saved">Saved</span><span>${p.at?'Finished '+nice(p.at,{day:'numeric',month:'short'}):'Not finished yet'}</span></div>`;
  $('#drawer').classList.add('on');$('#drawer').setAttribute('aria-hidden','false');$('#scrim').classList.add('on')}
function closeDrawer(){S.ui.drawer=null;$('#drawer').classList.remove('on');$('#drawer').setAttribute('aria-hidden','true');$('#scrim').classList.remove('on');render()}

/* ---------- coach ---------- */
let coachKind='morning',coachLine='';
function pickLine(k){const a=LINES[k]||LINES.morning;return a[Math.floor(Math.random()*a.length)].replace(/\{name\}/g,NAME)}
function speak(t){try{if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t),vs=speechSynthesis.getVoices();const v=vs.find(v=>/en[-_]IN/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;u.rate=.95;const av=$('.cav');u.onstart=()=>av&&av.classList.add('talk');u.onend=u.onerror=()=>av&&av.classList.remove('talk');speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function showCoach(k,auto){coachKind=k;coachLine=pickLine(k);const label=k==='morning'?'Morning nudge · '+t12(S.set.t1):k==='study'?'Study time · '+t12(S.set.t2):'Gentle check-in';
  const el=$('#coach');el.innerHTML=`<div class="cav">${coachSVG()}</div><div class="cbody"><div class="cslot">${label}</div><p class="cline">${esc(coachLine)}</p><div class="cbtn"><button class="btn sm pri" data-act="coachstart">Start</button><button class="btn sm" data-act="coachsnooze">Snooze 15 min</button><button class="btn sm ghost" data-act="coachclose">Not today</button><button class="btn sm ghost" data-act="coachvoice">▶ Play voice</button></div></div>`;
  requestAnimationFrame(()=>el.classList.add('on'));if(S.set.voice&&auto!==false)speak(coachLine)}
function hideCoach(){try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}$('#coach').classList.remove('on')}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;S.ui.focusQ=false;
  if(a==='enter'){S.ui.view='today';render();window.scrollTo(0,0)}
  else if(a==='landing'){S.ui.view='landing';render();window.scrollTo(0,0)}
  else if(a==='nav'){S.ui.view=b.dataset.v==='progress'?'progress':b.dataset.v;render();window.scrollTo(0,0)}
  else if(a==='phase'){S.ui.phase=+b.dataset.i;render()}
  else if(a==='topic'){S.ui.open[id]=!S.ui.open[id];render()}
  else if(a==='tick'){const on=!isDone(id);setDone(id,on);render();if(S.ui.drawer===id)openDrawer(id);toast(on?'Marked done: '+BY[id].t:'Marked not done',()=>{setDone(id,!on);render();if(S.ui.drawer===id)openDrawer(id)})}
  else if(a==='open'){openDrawer(id)}
  else if(a==='closeDrawer'){closeDrawer()}
  else if(a==='bm'){const p=S.P[id]||(S.P[id]={});p.bm=!p.bm;render()}
  else if(a==='status'){setStatus(id,b.dataset.s);render();openDrawer(id)}
  else if(a==='conf'){const p=S.P[id]||(S.P[id]={});p.c=p.c===+b.dataset.n?0:+b.dataset.n;render();openDrawer(id)}
  else if(a==='filter'){S.ui.filter=b.dataset.f;S.ui.focusQ=false;render()}
  else if(a==='src'){S.ui.src=S.ui.src===b.dataset.f?'':b.dataset.f;S.ui.focusQ=false;render()}
  else if(a==='cont'){const it=firstTodo();if(it){S.ui.view='sheet';S.ui.phase=it.topic.pi;S.ui.open[it.topic.id]=true;S.ui.q='';S.ui.filter='all';S.ui.src='';render();setTimeout(()=>openDrawer(it.id),60);window.scrollTo(0,0)}}
  else if(a==='qnext'){S.shift++;render()}
  else if(a==='qfav'){const q=quoteOfDay();S.fav=S.fav.includes(q.id)?S.fav.filter(x=>x!==q.id):S.fav.concat(q.id);render()}
  else if(a==='qcopy'){const t=quoteOfDay().text;try{navigator.clipboard.writeText(t).then(()=>toast('Quote copied'),()=>toast('Select the quote text to copy it'))}catch(er){toast('Select the quote text to copy it')}}
  else if(a==='revdone'){const p=S.P[id];if(p&&p.r){const s=Math.min(STEPS.length-1,p.r.step+1);p.r={step:s,due:addDays(tk(),STEPS[s])};bump(tk(),'r',1)}render();toast('Scheduled the next review')}
  else if(a==='revshaky'){const p=S.P[id];if(p&&p.r){const s=Math.max(0,p.r.step-1);p.r={step:s,due:addDays(tk(),STEPS[s])};p.c=Math.min(p.c||2,2);bump(tk(),'r',1)}render();toast('It will come back sooner')}
  else if(a==='dow'){S.set.dow[+b.dataset.i]=S.set.dow[+b.dataset.i]?0:1;render()}
  else if(a==='voice'){S.set.voice=!S.set.voice;render()}
  else if(a==='tgt'){S.set.target=Math.max(1,Math.min(12,S.set.target+ +b.dataset.d));render()}
  else if(a==='coach'){showCoach(b.dataset.k,true)}
  else if(a==='coachstart'){hideCoach();S.ui.view='today';render();toast('Opened Today. Pick up where you left off.')}
  else if(a==='coachsnooze'){hideCoach();toast('Snoozed. She will check in again in 15 minutes.')}
  else if(a==='coachclose'){hideCoach();toast('Okay. No more reminders for today.')}
  else if(a==='coachvoice'){speak(coachLine)}
  else if(a==='sample'){loadSample();render();window.scrollTo(0,0)}
  else if(a==='reset'){const v=S.ui.view;S=fresh();S.ui.view=v==='landing'?'today':v;render();toast('Everything is back to zero')}
  else if(a==='install'){toast('In the live app this installs SAIRA on your phone or laptop.')}
  else if(a==='copyjson'){const j=JSON.stringify({P:S.P,days:S.days,fav:S.fav,set:S.set},null,2);try{navigator.clipboard.writeText(j).then(()=>toast('Backup copied'),()=>toast('Copy was blocked here'))}catch(er){toast('Copy was blocked here')}}
  else if(a==='undo'){if(undoFn){undoFn();undoFn=null}$('#toast').classList.remove('on')}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.ui.q=t.value;S.ui.focusQ=true;render();return}
  if(t.dataset&&t.dataset.f&&S.ui.drawer){const p=S.P[S.ui.drawer]||(S.P[S.ui.drawer]={});p[t.dataset.f]=t.value;const sv=$('#saved');if(sv)sv.textContent='Saved';save()}
  if(t.dataset&&t.dataset.set){S.set[t.dataset.set]=t.value;save()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.ui.drawer)closeDrawer();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&S.ui.view==='sheet'){e.preventDefault();const q=$('#q');if(q)q.focus()}});
render();
})();
</script>

</body></html>
